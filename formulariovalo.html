<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Tarreo Valorant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor-formulario">
        <h2>Registro - Tarreo Valorant</h2>
        <p>Completa tus datos para asegurar tu cupo en el torneo.</p>

        <form action="#" method="POST">
            
            <div class="grupo-entrada">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required minlength="5" placeholder="Ej: Juan Pérez">
            </div>

            <div class="grupo-entrada">
                <label for="riot_id">Riot ID (incluye #)</label>
                <input type="text" id="riot_id" name="riot_id" required pattern="^.{3,16}#[a-zA-Z0-9]{3,5}$" placeholder="Ej: TenZ#NA1" title="Debe contener tu nombre seguido de # y tu tag">
            </div>

            <div class="grupo-entrada">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="tu@correo.cl">
            </div>

            <div class="grupo-entrada">
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" required min="17" max="99" placeholder="18">
            </div>

            <div class="grupo-entrada">
                <label for="rango">Rango Actual</label>
                <select id="rango" name="rango" required>
                    <option value="" disabled selected>Selecciona tu rango...</option>
                    <option value="hierro_bronce">Hierro - Bronce</option>
                    <option value="plata_oro">Plata - Oro</option>
                    <option value="platino_diamante">Platino - Diamante</option>
                    <option value="ascendente_radiante">Ascendente - Radiante</option>
                </select>
            </div>

            <button type="submit" class="btn-enviar">Confirmar Inscripción</button>

        </form>
    </div>

</body>
</html>
